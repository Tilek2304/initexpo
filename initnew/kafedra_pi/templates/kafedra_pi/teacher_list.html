{% extends 'main/layout.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'kafedra_pi/css/styles.css' %}">
<script src="{% static 'ckeditor/ckeditor.js' %}"></script>

<div class="container mt-4">
    <h1>Список преподавателей</h1>
    <div class="row">
        {% for teacher in teachers %}
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">{{ teacher.first_name }} {{ teacher.last_name }}</h5>
                    <p class="card-text">{{ teacher.bio|safe }}</p>
                    <a href="{% url 'teacher_detail' teacher.pk %}" class="btn btn-primary">Подробнее</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <a href="{% url 'contacts' %}" class="btn btn-secondary">Контакты</a>
</div>
{% endblock %}
